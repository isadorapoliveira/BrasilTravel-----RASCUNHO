spring.application.name=brasiltravel-aereo

# Banco de dados local
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brasiltravel_aereo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:udesc}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Servidor
server.port=${PORT:8080}

# Evita consultas ao banco durante a renderização da view
spring.jpa.open-in-view=false

# Recria dados comerciais de exemplo em ambiente local, removendo solicitações de teste anteriores.
app.dados-exemplo.recriar=${APP_DADOS_EXEMPLO_RECRIAR:true}
