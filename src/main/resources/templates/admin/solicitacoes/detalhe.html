<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Detalhe Administrativo - BrasilTravel Aéreo</title><link rel="stylesheet" th:href="@{/css/estilo.css}"></head>
<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<main class="container secao">
    <div class="titulo-secao linha-titulo"><div><p class="tag">Atendimento</p><h1 th:text="${'Solicitação #' + solicitacao.idSolicitacao}"></h1><p class="texto-apoio">Detalhe completo para atendimento da solicitação.</p></div><a class="btn btn-secundario" href="/admin/solicitacoes">Voltar</a></div>
    <section class="cards cards-perfil"><article class="card"><h3>Cliente e viagem</h3><dl class="lista-dados"><dt>Cliente</dt><dd th:text="${solicitacao.usuario.nome}"></dd><dt>E-mail</dt><dd th:text="${solicitacao.usuario.email}"></dd><dt>Destino</dt><dd th:text="${solicitacao.destinoPrincipal.nomeCompleto}"></dd><dt>Status</dt><dd th:text="${solicitacao.statusSolicitacao.descricao}"></dd><dt>Valor</dt><dd th:text="${'R$ ' + #numbers.formatDecimal(solicitacao.valorTotal, 1, 'POINT', 2, 'COMMA')}"></dd><dt>Observações</dt><dd th:text="${solicitacao.observacoes ?: 'Sem observações'}"></dd></dl></article><article class="card"><h3>Alterar status</h3><form class="formulario" th:action="@{/admin/solicitacoes/status/{id}(id=${solicitacao.idSolicitacao})}" method="post"><div class="campo"><label>Status</label><select name="statusSolicitacao"><option th:each="st : ${statusDisponiveis}" th:value="${st.name()}" th:text="${st.descricao}" th:selected="${st == solicitacao.statusSolicitacao}"></option></select></div><button class="btn btn-principal botao-formulario" type="submit">Salvar status</button></form></article></section>
    <section class="bloco-tabela"><h2>Voos solicitados</h2><div class="tabela-responsiva"><table><thead><tr><th>Trecho</th><th>Voo</th><th>Companhia</th><th>Origem</th><th>Destino</th><th>Partida</th><th>Chegada</th><th>Passageiros</th><th>Total</th></tr></thead><tbody><tr th:each="sv : ${solicitacao.voosSolicitados}"><td th:text="${sv.ordemVoo == 1 ? 'Ida' : 'Volta'}"></td><td th:text="${sv.voo.numeroVoo}"></td><td th:text="${sv.voo.companhia.nome}"></td><td th:text="${sv.voo.aeroportoOrigem.codigoIata + ' - ' + sv.voo.aeroportoOrigem.destino.nomeCompleto}"></td><td th:text="${sv.voo.aeroportoDestino.codigoIata + ' - ' + sv.voo.aeroportoDestino.destino.nomeCompleto}"></td><td th:text="${#temporals.format(sv.voo.dataHoraPartida, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${#temporals.format(sv.voo.dataHoraChegada, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${sv.qtdPassageiros}"></td><td th:text="${'R$ ' + #numbers.formatDecimal(sv.precoTotal, 1, 'POINT', 2, 'COMMA')}"></td></tr></tbody></table></div></section>
</main><footer class="rodape"><p>© 2026 BrasilTravel Aéreo — Projeto Banco de Dados II</p></footer>
</body></html>
